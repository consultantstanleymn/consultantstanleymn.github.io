<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stanley N.</title>
<style>
  :root {
    --bg-primary: #0b0f19;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-orange: #ff9900;
    --accent-blue: #38bdf8;
    --border-color: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .wrap { max-width: 560px; }
  .logo {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent-orange), #ea580c);
    color: #000;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 1.1rem;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 14px; }
  p { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 32px; line-height: 1.6; }
  .card {
    background: #1e293b;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    text-align: left;
  }
  .card a {
    display: block;
    color: var(--accent-blue);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 6px;
  }
  .card a:hover { text-decoration: underline; }
  .card span { color: var(--text-muted); font-size: 0.9rem; }
  @media (max-width: 480px) { h1 { font-size: 1.7rem; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">STANLEY N.</div>
    <h1>Portfolio — coming soon</h1>
    <p>This is the home for my personal portfolio. In the meantime, here's what's live:</p>
    <div class="card">
      <a href="/sa-pro/">AWS Solutions Architect Professional Study Portal &rarr;</a>
      <span>A 14-week, day-by-day SAP-C02 curriculum with hands-on labs and scenario questions.</span>
    </div>
  </div>
</body>
</html>
